[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "therapeutic-optimization"
version = "0.1.0"
description = "Modular protein de-ubiquitination design workflow coupling site prediction, mutation generation, structural screening, and re-ranking."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "biopython>=1.81",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
eup = [
  "torch>=2.0",
  "transformers>=4.30",
  "accelerate>=0.21",
  "safetensors>=0.3",
]
esm2 = [
  "torch>=2.0",
  "transformers>=4.30",
  "accelerate>=0.21",
  "safetensors>=0.3",
]
dev = ["pytest>=7.4"]

[project.scripts]
therapeutic-optimize = "therapeutic_optimization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
